    <text x="100" y="187" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#4FA3CD" letter-spacing="0.8">D8:18</text>
  </g>
  
  <!-- Wordmark "FirstSavvy" -->
