    <path d="M 140 68 C 146 78, 154 88, 164 96 C 168 100, 172 102, 172 107 C 170 112, 162 114, 158 115 C 166 118, 162 126, 154 128 C 146 130, 142 138, 142 148 C 142 160, 134 170, 118 176" 
